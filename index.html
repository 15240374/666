
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今天吃什麼？抽籤器</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #fff1d6, #ffd6c9);
      color: #49352b;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: white;
      padding: 32px;
      border-radius: 22px;
      box-shadow: 0 10px 35px rgba(100, 60, 30, 0.15);
      text-align: center;
    }

    h1 {
      font-size: 30px;
      margin: 0 0 10px;
    }

    .subtitle {
      color: #927b6c;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      height: 160px;
      padding: 15px;
      border: 2px solid #f0d8c8;
      border-radius: 12px;
      font-size: 16px;
      line-height: 1.8;
      resize: vertical;
      outline: none;
      font-family: inherit;
    }

    textarea:focus {
      border-color: #ff986b;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #ff895f;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #f16f45;
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.98);
    }

    .result-box {
      margin-top: 25px;
      padding: 25px 15px;
      border-radius: 15px;
      background: #fff5e9;
      border: 2px dashed #ffc18e;
    }

    .result-title {
      font-size: 16px;
      color: #997762;
      margin-bottom: 12px;
    }

    #result {
      font-size: 30px;
      font-weight: bold;
      color: #ed7046;
      min-height: 45px;
      overflow-wrap: anywhere;
    }

    .hint {
      font-size: 13px;
      color: #aa9587;
      margin-top: 18px;
    }

    .empty {
      color: #d9534f !important;
      font-size: 17px !important;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🍽️ 今天吃什麼？</h1>

    <p class="subtitle">
      選擇困難症救星，幫你決定今天吃什麼！
    </p>

    <textarea id="options">便當
麵
咖哩
水餃</textarea>

    <button id="drawButton">🎲 幫我選！</button>

    <div class="result-box">
      <div class="result-title">✨ 今日幸運美食</div>
      <div id="result">等待抽籤中...</div>
    </div>

    <div class="hint">
      每行輸入一個選項，重複項目會自動去除。
    </div>
  </div>

  <script>
    const optionsInput = document.getElementById("options");
    const drawButton = document.getElementById("drawButton");
    const result = document.getElementById("result");

    drawButton.addEventListener("click", function () {

      // 取得輸入內容
      const rawOptions = optionsInput.value.split("\n");

      // 去除前後空白、空白行及重複選項
      const validOptions = [
        ...new Set(
          rawOptions
            .map(option => option.trim())
            .filter(option => option.length > 0)
        )
      ];

      // 檢查清單是否為空
      if (validOptions.length === 0) {
        result.textContent = "請先輸入至少一個選項";
        result.classList.add("empty");
        return;
      }

      // 隨機抽選一個選項
      const randomIndex = Math.floor(
        Math.random() * validOptions.length
      );

      const selected = validOptions[randomIndex];

      // 顯示抽籤結果
      result.classList.remove("empty");
      result.textContent = "🎉 " + selected;
    });
  </script>

</body>
</html>
